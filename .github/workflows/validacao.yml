name: Validar BIND por papel
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bind9:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        papel: [primario, secundario]
    # Enderecos sinteticos de loopback; cada papel roda em um runner separado.
    env:
      BIND_ROLE: ${{ matrix.papel }}
      DNS_PRIMARY_IP: 127.0.0.1
      DNS_SECONDARY_IP: 127.0.0.2
      DNS_BIND_ADDRESS: ${{ matrix.papel == 'primario' && '127.0.0.1' || '127.0.0.2' }}
      DNS_CLIENT_CIDR: 127.0.0.0/8
      DNS_PORT: 1053
    steps:
      - uses: actions/checkout@v4
      - name: Validar Compose
        run: |
          docker compose --profile ferramentas config --quiet
          docker compose -f tutoriais/dns/bind9/docker-compose.yml --profile ferramentas config --quiet
      - name: Baixar imagens e gerar configuracao
        run: |
          docker compose --profile ferramentas pull
          docker compose run --rm configurador
      - name: Validar BIND
        run: |
          if [ "$BIND_ROLE" = primario ]; then
            docker compose run --rm --no-deps --entrypoint named-checkconf dns -z /etc/bind/named.conf
          else
            docker compose run --rm --no-deps --entrypoint named-checkconf dns /etc/bind/named.conf
          fi
      - name: Iniciar unica instancia e verificar prontidao
        run: docker compose up -d --wait --wait-timeout 120
      - name: Consultar zona primaria isolada
        if: matrix.papel == 'primario'
        run: docker compose run --rm --no-deps cliente sh /testes/verificar.sh local
      - name: Conferir quantidade de BIND e arquivos versionados
        run: |
          test "$(docker compose ps -q dns | wc -l)" -eq 1
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Registrar logs
        if: always()
        run: docker compose logs --no-color --tail=100
      - name: Limpar somente o projeto
        if: always()
        run: docker compose down --volumes --remove-orphans
