options {
    directory "/var/cache/bind";
    pid-file "/var/cache/bind/named.pid";
    session-keyfile "/var/cache/bind/session.key";
    listen-on port 53 { any; };
    listen-on-v6 { none; };
    allow-query { any; };

    // Apenas laboratório local; portas publicadas em loopback por padrão.
    recursion yes;
    allow-recursion { any; };
    allow-query-cache { any; };
    max-cache-size 32m;
    forward only;
    forwarders { 1.1.1.1; 9.9.9.9; };
    dnssec-validation auto;
    managed-keys-directory "/var/cache/bind";

    // Sem atualização dinâmica. Cada zona libera a transferência necessária.
    allow-transfer { none; };
    allow-update { none; };
};

// RNDC somente no loopback do contêiner, sem porta publicada no host.
controls {
    inet 127.0.0.1 port 953 allow { 127.0.0.1; } keys { "lab-transfer"; };
};
