x-bind: &bind
  # Índice multiarch fixo: AMD64 e ARM64, consultado em 14/10/2026.
  image: ubuntu/bind9:9.20-26.04_stable@sha256:f1a2a62ba28272eccb9efab3ebd2ba910e70edd93dd3c51dd130ba349aa13175
  # Executa named diretamente, sem o supervisor Pebble da imagem.
  entrypoint: [/usr/sbin/named]
  command: [-g, -n, "2", -c, /etc/bind/named.conf]
  # Laboratório: escrita apenas em volumes Docker; não requer privileged.
  user: "0:0"
  mem_limit: 192m
  healthcheck:
    test: [CMD, rndc, -c, /etc/bind/shared/rndc.conf, status]
    interval: 5s
    timeout: 3s
    retries: 12
    start_period: 10s

services:
  dns-primario:
    <<: *bind
    ports:
      - "${DNS_BIND_ADDRESS:-127.0.0.1}:${DNS_PRIMARY_PORT:-1053}:53/udp"
      - "${DNS_BIND_ADDRESS:-127.0.0.1}:${DNS_PRIMARY_PORT:-1053}:53/tcp"
    volumes:
      - ./config/primario:/etc/bind:ro
      - ./config/shared:/etc/bind/shared:ro
      - ./zones:/etc/bind/zones:ro
      - primario-cache:/var/cache/bind
      - primario-dados:/var/lib/bind
    networks:
      laboratorio:
        ipv4_address: 172.30.53.10

  dns-secundario:
    <<: *bind
    ports:
      - "${DNS_BIND_ADDRESS:-127.0.0.1}:${DNS_SECONDARY_PORT:-2053}:53/udp"
      - "${DNS_BIND_ADDRESS:-127.0.0.1}:${DNS_SECONDARY_PORT:-2053}:53/tcp"
    volumes:
      - ./config/secundario:/etc/bind:ro
      - ./config/shared:/etc/bind/shared:ro
      - secundario-cache:/var/cache/bind
      - secundario-dados:/var/lib/bind
    # Sem depends_on: deve conseguir reiniciar com o primário fora do ar.
    networks:
      laboratorio:
        ipv4_address: 172.30.53.11

  cliente:
    image: nicolaka/netshoot:v0.14@sha256:7f08c4aff13ff61a35d30e30c5c1ea8396eac6ab4ce19fd02d5a4b3b5d0d09a2
    profiles: [ferramentas]
    entrypoint: []
    command: [dig, "@dns-primario", lab.test, SOA]
    mem_limit: 128m
    volumes:
      - ./testes:/testes:ro
    networks:
      - laboratorio

networks:
  laboratorio:
    ipam:
      config:
        - subnet: 172.30.53.0/24

volumes:
  primario-cache:
  primario-dados:
  secundario-cache:
  secundario-dados:
